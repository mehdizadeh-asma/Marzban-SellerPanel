name: Build & Push Docker Images

on:
  push:
    tags:
      - "v*"
      - "dev-*"

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Detect build type and version
        id: meta
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "GITHUB_REF_NAME=$TAG_NAME"
          if [[ "$TAG_NAME" == v* ]]; then
            VERSION="${TAG_NAME#v}"
            echo "build_type=stable" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" == dev-* ]]; then
            echo "build_type=dev" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported tag: $TAG_NAME"
            exit 1
          fi

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.build_type == 'stable' && format('marzbansellerpanel/msp-frontend:{0}', steps.meta.outputs.version) || '' }}
            ${{ steps.meta.outputs.build_type == 'stable' && 'marzbansellerpanel/msp-frontend:latest' || '' }}
            ${{ steps.meta.outputs.build_type == 'dev' && 'marzbansellerpanel/msp-frontend:dev' || '' }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.build_type == 'stable' && format('marzbansellerpanel/msp-backend:{0}', steps.meta.outputs.version) || '' }}
            ${{ steps.meta.outputs.build_type == 'stable' && 'marzbansellerpanel/msp-backend:latest' || '' }}
            ${{ steps.meta.outputs.build_type == 'dev' && 'marzbansellerpanel/msp-backend:dev' || '' }}
