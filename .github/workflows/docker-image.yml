name: Build & Push Docker Images

on:
  push:
    tags:
      - "v*"
      - "dev-*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name (e.g. v2.5.9 or dev-2.5.9)"
        required: true
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Set build variables
        id: vars
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          fi

          if [[ "$TAG_NAME" == v* ]]; then
            BUILD_TYPE="release"
            VERSION="${TAG_NAME#v}"
            CHECKOUT_REF="main"

            FRONT_TAG_MAIN="marzbansellerpanel/msp-frontend:${VERSION}"
            FRONT_TAG_EXTRA="marzbansellerpanel/msp-frontend:latest"

            BACK_TAG_MAIN="marzbansellerpanel/msp-backend:${VERSION}"
            BACK_TAG_EXTRA="marzbansellerpanel/msp-backend:latest"
          elif [[ "$TAG_NAME" == dev-* ]]; then
            BUILD_TYPE="dev"
            VERSION="${TAG_NAME#dev-}"
            CHECKOUT_REF="development"

            FRONT_TAG_MAIN="marzbansellerpanel/msp-frontend:dev"
            FRONT_TAG_EXTRA=""

            BACK_TAG_MAIN="marzbansellerpanel/msp-backend:dev"
            BACK_TAG_EXTRA=""
          else
            echo "Unsupported tag pattern: $TAG_NAME"
            exit 1
          fi

          {
            echo "TAG_NAME=$TAG_NAME"
            echo "BUILD_TYPE=$BUILD_TYPE"
            echo "VERSION=$VERSION"
            echo "CHECKOUT_REF=$CHECKOUT_REF"
            echo "FRONT_TAG_MAIN=$FRONT_TAG_MAIN"
            echo "FRONT_TAG_EXTRA=$FRONT_TAG_EXTRA"
            echo "BACK_TAG_MAIN=$BACK_TAG_MAIN"
            echo "BACK_TAG_EXTRA=$BACK_TAG_EXTRA"
          } >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend (release)
        if: env.BUILD_TYPE == 'release'
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.FRONT_TAG_MAIN }}
            ${{ env.FRONT_TAG_EXTRA }}

      - name: Build and Push Frontend (dev)
        if: env.BUILD_TYPE == 'dev'
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.FRONT_TAG_MAIN }}

      - name: Build and Push Backend (release)
        if: env.BUILD_TYPE == 'release'
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.BACK_TAG_MAIN }}
            ${{ env.BACK_TAG_EXTRA }}

      - name: Build and Push Backend (dev)
        if: env.BUILD_TYPE == 'dev'
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.BACK_TAG_MAIN }}
